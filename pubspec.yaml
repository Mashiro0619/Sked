name: sked
description: "A local-first timetable and schedule management app."
publish_to: 'none'

version: 2.2.0+12

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  web: ^1.1.1

  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  http: ^1.5.0
  html: ^0.15.7
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  # 6.2 is the first line whose Android plugin supports AGP 9.
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_colorpicker: ^1.1.0
  lunar: ^1.7.8
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  timezone: ^0.11.1
  material_ui: ^1.1.1
  cupertino_ui: ^1.0.2
  sked_android_productivity_plugin:
    path: packages/android_productivity_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  xml: ^7.0.1
  yaml: ^3.1.3
  msix: ^3.18.0

# Temporary pins for https://github.com/pichillilorenzo/flutter_inappwebview/pull/2809.
# Xcode 26 rejects the published beta.3 Apple plugins because their
# ASWebAuthenticationPresentationContextProviding conformance has an invalid
# availability boundary. Keep the immutable commit until the upstream fix is
# released on pub.dev.
dependency_overrides:
  # flutter_inappwebview 6.2.0-beta.3 still calls deprecated Android 15
  # edge-to-edge window APIs. Pin the upstream fix until it is released.
  flutter_inappwebview_android:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: e879b0350f3a09e6e0eb0667569bcaa74cc59acb
      path: flutter_inappwebview_android
  flutter_inappwebview_macos:
    git:
      url: https://github.com/wangqiang1588/flutter_inappwebview.git
      ref: fc33a449b9290b127a471808e22eb7b0edebad92
      path: flutter_inappwebview_macos
  flutter_inappwebview_ios:
    git:
      url: https://github.com/wangqiang1588/flutter_inappwebview.git
      ref: fc33a449b9290b127a471808e22eb7b0edebad92
      path: flutter_inappwebview_ios

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/default_period_times.json
    - assets/school_sites.json
    - NOTICE

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: "assets/sked.png"
  adaptive_icon_foreground: "assets/sked_0.png"
  adaptive_icon_background: "#FFFFFF"

msix_config:
  display_name: Sked
  publisher_display_name: Mashiro
  identity_name: Mashiro.Sked
  logo_path: assets/sked.png
  capabilities: internetClient
  toast_activator:
    clsid: 5d9d8f6a-4d1a-4f3a-9b0a-6a3e7d2c1f58
    display_name: Sked notification activator
