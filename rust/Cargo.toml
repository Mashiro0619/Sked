[package]
name = "sked_agent_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rig = { version = "=0.46.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util", "process"] }
tokio-util = { version = "=0.7.20", features = ["rt", "io"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "=0.22.1"
async-stream = "=0.3.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls"] }
encoding_rs = "=0.8.44"
scraper = { version = "=0.29.0", default-features = false }
html5ever = "=0.40.1"
async-compression = { version = "=0.4.52", features = ["tokio", "gzip", "brotli", "zlib"] }
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
libc = "=0.2.191"
rustls-platform-verifier = "=0.7.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
