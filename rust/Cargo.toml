[package]
name = "sked_agent_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rig = { version = "=0.46.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "=0.22.1"
async-stream = "=0.3.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls"] }
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
regex = "=1.13.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
