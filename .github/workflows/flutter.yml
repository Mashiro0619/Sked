name: Flutter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # The generated localizations under lib/l10n/ are committed on purpose,
      # so CI has to guarantee they still match the .arb sources. Regenerating
      # here must be a no-op; anything else means an .arb was edited without
      # running `flutter gen-l10n` (or the Flutter generator itself changed).
      - name: Verify generated l10n is in sync with ARB
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain lib/l10n/)" ]; then
            echo "::error::lib/l10n/ is out of sync with the .arb sources. Run 'flutter gen-l10n' locally and commit the result."
            git status --porcelain lib/l10n/
            git diff -- lib/l10n/
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Resolve coverage comparison base
        id: coverage-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref }}
        run: dart run tool/coverage_base.dart

      - name: Measure base coverage
        id: base-coverage
        if: steps.coverage-base.outputs.is_commit == 'true'
        env:
          BASE_SHA: ${{ steps.coverage-base.outputs.sha }}
        run: |
          base_dir="$RUNNER_TEMP/sked-coverage-base"
          base_status=0
          git worktree add --detach "$base_dir" "$BASE_SHA" || base_status=$?
          if [ "$base_status" -eq 0 ]; then
            pushd "$base_dir"
            flutter pub get --enforce-lockfile && flutter test --coverage || base_status=$?
            popd
          fi
          if [ "$base_status" -eq 0 ] && [ -f "$base_dir/coverage/lcov.info" ]; then
            cp "$base_dir/coverage/lcov.info" coverage/lcov.base.info
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Base coverage could not be measured (exit $base_status). The absolute bootstrap floor and 90% diff gate remain active so a PR can repair a red base."
            echo "Base coverage unavailable; using the bootstrap floor plus diff gate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce coverage gates
        env:
          BASE_SHA: ${{ steps.coverage-base.outputs.sha }}
          BASE_COVERAGE_AVAILABLE: ${{ steps.base-coverage.outputs.available }}
        run: |
          baseline_args=()
          total_floor=81.76
          if [ "$BASE_COVERAGE_AVAILABLE" = true ]; then
            baseline_args+=(
              --baseline-lcov coverage/lcov.base.info
              --baseline-root "$RUNNER_TEMP/sked-coverage-base"
            )
            # Both snapshots were measured on this Ubuntu runner, so their
            # exact comparison replaces the Windows-only bootstrap floor.
            total_floor=0
          fi
          set +e
          dart run tool/coverage_gate.dart \
            --base-ref "$BASE_SHA" \
            --head-ref HEAD \
            --minimum-total "$total_floor" \
            --minimum-diff 90 \
            --github-annotations \
            "${baseline_args[@]}"
          coverage_status=$?
          set -e
          cat coverage/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$coverage_status"

      - name: Test browser instance lease
        timeout-minutes: 10
        run: flutter test --platform chrome test/services/app_instance_lease_web_test.dart

      - name: Test DST regressions in America/New_York
        env:
          TZ: America/New_York
          SKED_DST_TEST_ZONE: america-new-york
        run: flutter test test/date_dst_regression_test.dart

      - name: Test DST regressions in Europe/Berlin
        env:
          TZ: Europe/Berlin
          SKED_DST_TEST_ZONE: europe-berlin
        run: flutter test test/date_dst_regression_test.dart

      - name: Build web
        run: flutter build web --debug

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Generate release Android security artifacts
        id: android-security-artifacts
        working-directory: android
        run: |
          ./gradlew \
            :app:processReleaseMainManifest \
            :app:mergeReleaseResources \
            --no-daemon

      - name: Verify release merged Android manifest
        run: |
          dart run tool/platform_artifact_check.dart android-manifest \
            --manifest build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml \
            --resource-root build/app/intermediates/merged-not-compiled-resources/release \
            --application-id com.mashiro.sked \
            --target-sdk 36

      - name: Upload release Android security artifacts
        if: ${{ !cancelled() && steps.android-security-artifacts.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release-security-artifacts-${{ github.run_attempt }}
          path: |
            build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
            build/app/intermediates/merged-not-compiled-resources/release/**/data_extraction_rules.xml
            build/app/intermediates/merged-not-compiled-resources/release/**/network_security_config.xml
            build/app/intermediates/merged-not-compiled-resources/release/values*/**/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            coverage/lcov.base.info
            coverage/lcov.filtered.info
            coverage/coverage-summary.txt
          if-no-files-found: error
          retention-days: 14

  desktop-build:
    name: Build ${{ matrix.target }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev

      - name: Install NuGet
        if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: '7.6.0'

      - name: Verify NuGet
        if: matrix.target == 'windows'
        run: nuget locals all -list

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Apple source configuration
        if: matrix.target == 'macos'
        run: flutter test test/platform/platform_security_config_test.dart

      - name: Build release application
        run: flutter build ${{ matrix.target }} --release

      - name: Verify built macOS bundle
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/sked.app"
          info_plist="$RUNNER_TEMP/sked-macos-info.plist"
          raw_entitlements="$RUNNER_TEMP/sked-macos-entitlements-raw.plist"
          entitlements_plist="$RUNNER_TEMP/sked-macos-entitlements.plist"

          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          plutil -convert xml1 -o "$info_plist" "$app_path/Contents/Info.plist"
          codesign --display --entitlements - --xml "$app_path" > "$raw_entitlements"
          plutil -convert xml1 -o "$entitlements_plist" "$raw_entitlements"
          plutil -lint "$info_plist" "$entitlements_plist"

          dart run tool/platform_artifact_check.dart macos-bundle \
            --info-plist "$info_plist" \
            --entitlements-plist "$entitlements_plist" \
            --bundle-id com.mashiro.sked
