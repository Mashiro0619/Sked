name: Flutter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify internal plugin lockfile
        working-directory: packages/android_productivity_plugin
        run: flutter pub get --enforce-lockfile

      # The generated localizations under lib/l10n/ are committed on purpose,
      # so CI has to guarantee they still match the .arb sources. Regenerating
      # here must be a no-op; anything else means an .arb was edited without
      # running `flutter gen-l10n` (or the Flutter generator itself changed).
      - name: Verify generated l10n is in sync with ARB
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain lib/l10n/)" ]; then
            echo "::error::lib/l10n/ is out of sync with the .arb sources. Run 'flutter gen-l10n' locally and commit the result."
            git status --porcelain lib/l10n/
            git diff -- lib/l10n/
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test browser instance lease
        timeout-minutes: 10
        run: flutter test --platform chrome test/services/app_instance_lease_web_test.dart

      - name: Test DST regressions in America/New_York
        env:
          TZ: America/New_York
          SKED_DST_TEST_ZONE: america-new-york
        run: >-
          flutter test test/date_dst_regression_test.dart
          test/named_timezone_indexed_reminder_test.dart
          test/models/general_event_occurrence_range_test.dart
          test/services/general_reminder_indexed_items_test.dart
          test/services/general_occurrence_cache_test.dart
          test/services/windows_agenda_notification_coverage_test.dart

      - name: Test DST regressions in Europe/Berlin
        env:
          TZ: Europe/Berlin
          SKED_DST_TEST_ZONE: europe-berlin
        run: >-
          flutter test test/date_dst_regression_test.dart
          test/named_timezone_indexed_reminder_test.dart
          test/models/general_event_occurrence_range_test.dart
          test/services/general_reminder_indexed_items_test.dart
          test/services/general_occurrence_cache_test.dart
          test/services/windows_agenda_notification_coverage_test.dart

      - name: Test calendar regressions in Asia/Shanghai (non-DST control)
        env:
          TZ: Asia/Shanghai
          SKED_DST_TEST_ZONE: asia-shanghai
        run: >-
          flutter test test/date_dst_regression_test.dart
          test/named_timezone_indexed_reminder_test.dart
          test/models/general_event_occurrence_range_test.dart
          test/services/general_reminder_indexed_items_test.dart
          test/services/general_occurrence_cache_test.dart
          test/services/windows_agenda_notification_coverage_test.dart

      - name: Test missing midnight in America/Sao_Paulo
        env:
          TZ: America/Sao_Paulo
          SKED_DST_TEST_ZONE: america-sao-paulo
        run: >-
          flutter test test/date_dst_regression_test.dart
          test/named_timezone_indexed_reminder_test.dart
          test/models/general_event_occurrence_range_test.dart
          test/services/general_reminder_indexed_items_test.dart
          test/services/general_occurrence_cache_test.dart
          test/services/windows_agenda_notification_coverage_test.dart

      - name: Test skipped civil date in Pacific/Apia
        env:
          TZ: Pacific/Apia
          SKED_DST_TEST_ZONE: pacific-apia
        run: >-
          flutter test test/named_timezone_indexed_reminder_test.dart
          test/models/general_recurrence_exception_timezone_test.dart
          test/models/general_event_occurrence_range_test.dart
          test/services/general_reminder_indexed_items_test.dart
          test/services/general_occurrence_cache_test.dart
          test/services/windows_agenda_notification_coverage_test.dart

      - name: Build web release
        run: flutter build web --release

  test-shards:
    name: VM tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test shard with coverage
        run: flutter test --no-pub --coverage --concurrency=2 --total-shards=4 --shard-index=${{ matrix.shard }}

      - name: Upload shard coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  coverage:
    needs: test-shards
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sked-coverage-shards
          merge-multiple: false

      - name: Merge complete shard coverage
        run: dart tool/merge_lcov.dart "$RUNNER_TEMP/sked-coverage-shards" coverage/lcov.info 4

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  # Keep the existing required `test` check: skipped/cancelled/failed shards or
  # missing coverage cannot turn it green merely because formatting passed.
  test:
    needs: [checks, test-shards, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all test results
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -eu
          test "$CHECKS_RESULT" = success
          test "$SHARDS_RESULT" = success
          test "$COVERAGE_RESULT" = success

  android-build:
    name: Build Android release (CI signing only)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # These APK/AAB builds exercise release shrinking and packaging, not
      # production signing. Never expose a publishing key to pull requests.
      - name: Prepare ephemeral CI signing key
        shell: bash
        run: |
          set -eu
          umask 077
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sked-ci-release.jks" \
            -storetype JKS \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias sked-ci -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Sked CI, OU=CI, O=Sked, C=CN"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=sked-ci\nstoreFile=%s\n' \
            "$signing_password" "$signing_password" \
            "$RUNNER_TEMP/sked-ci-release.jks" > android/key.properties

      # gradlew and its wrapper JAR are generated and ignored by Git. The
      # first Flutter Android build must prepare them before direct Gradle use.
      - name: Build Android APK release
        run: flutter build apk --release

      # This Flutter/AGP setup exposes the debug JVM test variant only.
      # APK/AAB release compilation and shrinking are checked separately.
      - name: Test Android native unit tests
        id: android-unit-tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Keep tooling preparation enabled: --no-pub can retain the debug
      # registrant even though release excludes dev-only integration_test.
      - name: Build Android App Bundle release
        run: flutter build appbundle --release --dart-define=SKED_DISTRIBUTION_CHANNEL=google-play

      - name: Generate release Android security artifacts
        id: android-security-artifacts
        working-directory: android
        run: |
          ./gradlew \
            :app:processReleaseMainManifest \
            :app:mergeReleaseResources \
            --no-daemon

      - name: Verify release merged Android manifest
        run: |
          dart run tool/platform_artifact_check.dart android-manifest \
            --manifest build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml \
            --resource-root build/app/intermediates/merged-not-compiled-resources/release \
            --application-id com.mashiro.sked \
            --target-sdk 36

      - name: Upload release Android security artifacts
        if: ${{ !cancelled() && steps.android-security-artifacts.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release-security-artifacts-${{ github.run_attempt }}
          path: |
            build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
            build/app/intermediates/merged-not-compiled-resources/release/**/data_extraction_rules.xml
            build/app/intermediates/merged-not-compiled-resources/release/**/network_security_config.xml
            build/app/intermediates/merged-not-compiled-resources/release/values*/**/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android native test report
        if: ${{ !cancelled() && steps.android-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-native-tests-${{ github.run_attempt }}
          path: build/app/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral CI signing key
        if: always()
        shell: bash
        run: rm -f -- android/key.properties "$RUNNER_TEMP/sked-ci-release.jks"

  linux-build:
    name: Build linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:13-slim

    steps:
      # flutter_inappwebview_linux requires WPE WebKit 2.40 or newer. Ubuntu
      # 22.04 only provides 2.36, whose legacy headers cannot compile the
      # plugin. Debian 13 provides the compatible 2.48 API as system packages.
      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            jq \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwpe-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwpewebkit-2.0-dev \
            ninja-build \
            pkg-config \
            unzip \
            xz-utils \
            zstd

          wpe_version="$(pkg-config --modversion wpe-webkit-2.0)"
          echo "Using WPE WebKit $wpe_version"
          dpkg --compare-versions "$wpe_version" ge 2.40

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # The SDK archive is extracted by the runner user inside the container,
      # while the action steps run as the container user. Git 2.35+ therefore
      # rejects Flutter's own checkout as a dubious repository unless it is
      # explicitly trusted.
      - name: Trust Flutter SDK checkout
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Enable desktop target
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release application
        run: flutter build linux --release

  desktop-build:
    name: Build ${{ matrix.target }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install NuGet
        if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: '7.6.0'

      - name: Verify NuGet
        if: matrix.target == 'windows'
        run: nuget locals all -list

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release application
        if: matrix.target != 'windows'
        run: flutter build ${{ matrix.target }} --release

      - name: Build Windows MSIX notification package
        if: matrix.target == 'windows'
        run: pwsh -File tool/build_msix.ps1 -Unsigned

      - name: Verify Windows toast manifest identity
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $archive = "build/windows/x64/runner/Release/sked.msix"
          $destination = Join-Path $env:RUNNER_TEMP "sked-msix-manifest"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $manifest = Get-Content -Raw -Encoding utf8 (Join-Path $destination "AppxManifest.xml")
          if ($manifest -notmatch 'Name="Mashiro\.Sked"') { throw "Unexpected MSIX identity name" }
          if ($manifest -notmatch 'ToastActivatorCLSID="5d9d8f6a-4d1a-4f3a-9b0a-6a3e7d2c1f58"') { throw "Missing toast activator" }

      # Store packaging rebuilds with the Store-only update channel and verifies
      # its actual manifest. No certificate or Partner Center credentials are used.
      - name: Build Microsoft Store submission package
        if: matrix.target == 'windows'
        run: pwsh -File tool/build_msix.ps1 -Store

      - name: Upload Microsoft Store submission package
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-msix
          path: build/microsoft-store/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned iOS release
        if: matrix.target == 'macos'
        run: flutter build ios --release --no-codesign

      - name: Verify built macOS bundle
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/sked.app"
          info_plist="$RUNNER_TEMP/sked-macos-info.plist"
          raw_entitlements="$RUNNER_TEMP/sked-macos-entitlements-raw.plist"
          entitlements_plist="$RUNNER_TEMP/sked-macos-entitlements.plist"

          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          plutil -convert xml1 -o "$info_plist" "$app_path/Contents/Info.plist"
          codesign --display --entitlements - --xml "$app_path" > "$raw_entitlements"
          plutil -convert xml1 -o "$entitlements_plist" "$raw_entitlements"
          plutil -lint "$info_plist" "$entitlements_plist"

          dart run tool/platform_artifact_check.dart macos-bundle \
            --info-plist "$info_plist" \
            --entitlements-plist "$entitlements_plist" \
            --bundle-id com.mashiro.sked
